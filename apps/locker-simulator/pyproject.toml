[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "locker-simulator"
version = "0.1.0"
description = "MQTT locker laboratory simulator"
requires-python = ">=3.12"
dependencies = ["paho-mqtt>=2.1,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "ruff>=0.8,<1.0"]

[tool.setuptools]
packages = ["locker_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
