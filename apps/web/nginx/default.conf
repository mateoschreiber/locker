# Primary laboratory configuration (F4.3/F4.4): points the React panel on
# port 8083 to the Rust backend (`api-rust:8001`).
#
# The upstream hostname is passed through a variable so nginx resolves it per
# request through Docker's embedded DNS (127.0.0.11) instead of caching one
# IP at startup (prevents permanent 502s after `docker compose restart api-rust`).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        set $rust_upstream api-rust:8001;
        proxy_pass http://$rust_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        set $rust_upstream api-rust:8001;
        proxy_pass http://$rust_upstream/docs;
    }

    location = /openapi.json {
        set $rust_upstream api-rust:8001;
        proxy_pass http://$rust_upstream/openapi.json;
    }

    location /health/ {
        set $rust_upstream api-rust:8001;
        proxy_pass http://$rust_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
