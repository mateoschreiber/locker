# Dynamic upstream resolution via Docker's embedded DNS (127.0.0.11):
# restarting the `api` container may assign a new container IP, and a
# static proxy_pass would keep dialing the old address with 502 forever
# (same root cause diagnosed in CI #23 for rust.conf).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream/docs;
    }

    location = /openapi.json {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream/openapi.json;
    }

    location /health/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
