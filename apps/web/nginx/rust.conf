# Rust preview configuration (F4.1-C): same panel, backend pointed at the
# isolated Rust API instead of the laboratory Python one. Mounted over the
# image's default.conf; apps/web/nginx/default.conf stays untouched.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api-rust:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass http://api-rust:8001/docs;
    }

    location = /openapi.json {
        proxy_pass http://api-rust:8001/openapi.json;
    }

    location /health/ {
        proxy_pass http://api-rust:8001;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
