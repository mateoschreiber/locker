# Rust preview configuration (F4.1-C): same panel, backend pointed at the
# isolated Rust API instead of the laboratory Python one. Mounted over the
# image's default.conf; apps/web/nginx/default.conf stays untouched.
#
# The upstream hostname is passed through a variable so nginx resolves it per
# request through Docker's embedded DNS (127.0.0.11) instead of caching one
# IP at startup: `docker compose restart api-rust` hands the container a new
# IP, and a statically-resolved proxy_pass kept dialing the dead one forever
# (CI #23: 502 "Host is unreachable" after the mid-operation restart while
# the Rust process itself was up, subscribed and ready).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        set $rust_upstream api-rust:8001;
        proxy_pass http://$rust_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        set $rust_upstream api-rust:8001;
        proxy_pass http://$rust_upstream/docs;
    }

    location = /openapi.json {
        set $rust_upstream api-rust:8001;
        proxy_pass http://$rust_upstream/openapi.json;
    }

    location /health/ {
        set $rust_upstream api-rust:8001;
        proxy_pass http://$rust_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
