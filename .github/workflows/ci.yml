name: CI

# Manual-only (F4.1-D): local validation (scripts/check-local.ps1) is the
# primary gate; this workflow stays available on demand from the Actions tab
# for a full remote verification. Nothing runs automatically on push.
on:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-rust
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: locker_rust
          POSTGRES_PASSWORD: rust_test_only
          POSTGRES_DB: locker_rust_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U locker_rust -d locker_rust_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LOCKER_TEST_DATABASE_URL: postgres://locker_rust:rust_test_only@127.0.0.1:5432/locker_rust_test
      LOCKER_TEST_MQTT_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      # Job services start before checkout, so they cannot bind-mount files
      # from the workspace; the broker is started with docker run instead.
      - name: Start isolated Mosquitto
        run: |
          test -f "$GITHUB_WORKSPACE/infra/docker/mosquitto.conf" || {
            echo "::error::infra/docker/mosquitto.conf not found after checkout"
            exit 1
          }
          docker run -d --name mosquitto-test \
            -p 127.0.0.1:1883:1883 \
            -v "$GITHUB_WORKSPACE/infra/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2.0.22
          for attempt in $(seq 1 30); do
            if docker exec mosquitto-test mosquitto_sub -h localhost -t '$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1; then
              echo "Mosquitto accepts MQTT connections on 127.0.0.1:1883"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Mosquitto did not accept MQTT connections in time"
          docker logs mosquitto-test
          exit 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked -- --ignored
      - run: cargo build --release --locked
      - name: Remove Mosquitto
        if: always()
        run: docker rm -f mosquitto-test

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[dev]'
      - run: ruff check .
      - run: mypy app
      - run: pytest

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/locker-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[dev]'
      - run: ruff check .
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose -p locker-rust-ci --profile rust build api-rust
      - run: python scripts/test_rust_docker.py locker-rust-ci-api-rust
      - run: docker compose -f compose.rust-preview.yaml config --quiet
      - run: python scripts/test_rust_preview.py

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p locker-phase0-ci -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
      - if: always()
        run: docker compose -p locker-phase0-ci -f compose.test.yaml down -v
      - run: python scripts/test_docker_restart.py

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/test_phase2_parity.py

  mqtt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/test_rust_mqtt.py
