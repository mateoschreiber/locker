name: CI

# Manual-only: local validation (scripts/check-local.ps1) is the primary gate;
# this workflow stays available on demand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-rust
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: locker_rust
          POSTGRES_PASSWORD: rust_test_only
          POSTGRES_DB: locker_rust_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U locker_rust -d locker_rust_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LOCKER_TEST_DATABASE_URL: postgres://locker_rust:rust_test_only@127.0.0.1:5432/locker_rust_test
      LOCKER_TEST_MQTT_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated Mosquitto
        run: |
          docker run -d --name mosquitto-test \
            -p 127.0.0.1:1883:1883 \
            -v "$GITHUB_WORKSPACE/infra/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2.0.22
          for attempt in $(seq 1 30); do
            if docker exec mosquitto-test mosquitto_sub -h localhost -t '$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs mosquitto-test
          exit 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked -- --ignored
      - run: cargo build --release --locked
      - name: Remove Mosquitto
        if: always()
        run: docker rm -f mosquitto-test

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/locker-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[dev]'
      - run: ruff check .
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
